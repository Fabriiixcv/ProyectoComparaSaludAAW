<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="shortcut icon" href="../assets/logo.ico" type="image/x-icon" />
<title>Agregar Medicamento - ComparaSalud</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
body{font-family:"Inter",sans-serif}
html{scroll-behavior:smooth}
.health-gradient{background:linear-gradient(135deg,#2563eb 0%,#10b981 100%)}
.shadow-soft{box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06)}

</style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<header class="bg-white sticky top-0 z-50 border-b border-gray-100">
  <div class="container mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-14">
      <a href="3_provider_home.html" class="flex items-center space-x-3">
        <img src="../assets/img/logo.png" alt="ComparaSalud" class="w-10 h-10" />
        <span class="text-xl font-bold text-gray-900">ComparaSalud</span>
      </a>
      <nav class="hidden lg:flex items-center space-x-8">
<a href="3_provider_home.html" class="text-gray-700 hover:text-[#2563EB] font-medium transition-colors">Inicio</a>
<a href="9_medication_catalog.html" class="text-[#2563EB] font-medium">Catálogo</a>
<a href="9_servicio_catalog.html" class="text-gray-700 hover:text-[#2563EB] font-medium transition-colors">Servicios</a>
<a href="9_medico_catalog.html" class="text-gray-700 hover:text-[#2563EB] font-medium transition-colors">Médicos</a>
<a href="9_provider_edit.html" class="text-gray-700 hover:text-[#2563EB] font-medium transition-colors">Mi sede</a>
<a href="8_help_center.html" class="text-gray-700 hover:text-[#2563EB] font-medium transition-colors">Ayuda</a>
</nav>
    </div>
    <div class="flex items-center space-x-3">
      <span class="hidden md:block text-gray-700 font-medium">Clínica Demo</span>
      <a href="1_2_auth.html" class="text-gray-700 px-3 py-2 rounded-lg hover:bg-gray-100" aria-label="Cerrar Sesión"><i class="fas fa-sign-out-alt"></i></a>
    </div>
  </div>
</header>

<section class="health-gradient text-white py-10">
  <div class="container mx-auto px-4 text-center max-w-3xl">
    <h1 class="text-3xl md:text-4xl font-bold mb-3">Agregar Medicamento</h1>
    <p class="text-lg opacity-90">Registra un medicamento para ofrecerlo a los pacientes de tu sede</p>
  </div>
</section>

<main class="flex-1 container mx-auto px-4 py-10">
  <div class="max-w-2xl mx-auto">
    <form class="bg-white rounded-2xl shadow-soft p-6 md:p-8 space-y-6" onsubmit="return false">
      <div>
        <label for="nombre" class="block text-gray-700 text-sm font-medium mb-2">Nombre comercial *</label>
        <input type="text" id="nombre" value="Amoxicilina 500 mg" placeholder="Ej: Paracetamol 500 mg"
          class="w-full px-4 py-3 bg-white rounded-xl border border-gray-200 focus:outline-none focus:border-[#2563EB]" />
      </div>
      <div>
        <label for="desc" class="block text-gray-700 text-sm font-medium mb-2">Descripción *</label>
        <textarea id="desc" rows="4" class="w-full px-4 py-3 bg-white rounded-xl border border-gray-200 focus:outline-none focus:border-[#2563EB] resize-none">Caja x 12 cápsulas. Antibiótico de amplio espectro con receta médica.</textarea>
        <p class="text-gray-400 text-xs text-right mt-1">69/500</p>
      </div>
      <div>
        <label for="precio" class="block text-gray-700 text-sm font-medium mb-2">Precio (S/) *</label>
        <div class="relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">S/</span>
          <input type="number" id="precio" value="15.90" step="0.01" min="0.01"
            class="w-full pl-10 pr-4 py-3 bg-white rounded-xl border border-gray-200 focus:outline-none focus:border-[#2563EB]" />
        </div>
      </div>
      <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-2">
        <a href="9_medication_catalog.html" class="text-center px-6 py-3 rounded-xl border border-gray-200 text-gray-700 font-medium hover:bg-gray-50">Cancelar</a>
        <a href="9_medication_catalog.html#exito" class="text-center health-gradient text-white px-6 py-3 rounded-xl font-medium hover:opacity-90"><i class="fas fa-save mr-2"></i>Guardar Medicamento</a>
      </div>
    </form>
  </div>
</main>

<footer class="bg-gray-800 text-white py-8 text-center text-sm">© 2025 ComparaSalud. Todos los derechos reservados.</footer>
</body>
</html>
