  3: { nombre:"Losartán 50 mg", pres:"Caja x 30 tabletas", cat:"Cardiovasculares", precio:18.00, rating:4.7, rev:145, sede:"Centro Cardiológico", rx:true, activo:"Losartán potásico",

  4: { nombre:"Amoxicilina 500 mg", pres:"Caja x 12 cápsulas", cat:"Antibióticos", precio:15.90, rating:4.4, rev:176, sede:"Clínica Miraflores Salud", rx:true, activo:"Amoxicilina",

    usos:["Infecciones respiratorias","Infecciones de garganta y oído","Infecciones urinarias"],
    adv:["Completar el tratamiento aunque los síntomas mejoren.","Puede causar diarrea o malestar estomacal.","Suspender ante erupción cutánea o dificultad para respirar."],

  5: { nombre:"Omeprazol 20 mg", pres:"Caja x 14 cápsulas", cat:"Gastrointestinales", precio:11.20, rating:4.5, rev:121, sede:"Centro Médico San Isidro", rx:false, activo:"Omeprazol",

  6: { nombre:"Loratadina 10 mg", pres:"Caja x 10 tabletas", cat:"Antialérgicos", precio:6.80, rating:4.3, rev:89, sede:"Policlínico La Molina", rx:false, activo:"Loratadina",

    adv:["Precaución en enfermedad hepática.","Rara vez puede producir somnolencia o dolor de cabeza."],

    rec:["Una tableta al día.","Puede tomarse con o sin alimentos.","Consulta a tu médico si estás embarazada o en lactancia."] },
  7: { nombre:"Metformina 850 mg", pres:"Caja x 30 tabletas", cat:"Endocrinológicos", precio:14.50, rating:4.7, rev:210, sede:"Clínica Surco Vital", rx:true, activo:"Metformina clorhidrato",

  8: { nombre:"Atorvastatina 20 mg", pres:"Caja x 30 tabletas", cat:"Cardiovasculares", precio:24.00, rating:4.9, rev:97, sede:"Laboratorio Miraflores Diagnóstica", rx:true, activo:"Atorvastatina cálcica",

    adv:["Reportar dolor o debilidad muscular inexplicable.","Se recomiendan controles periódicos de función hepática.","Evitar el consumo excesivo de jugo de toronja."],

  9: { nombre:"Salbutamol inhalador", pres:"Frasco 200 dosis", cat:"Respiratorios", precio:19.90, rating:4.6, rev:133, sede:"Clínica San Juan", rx:false, activo:"Salbutamol sulfato",

const esc = (s) => { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; };
const est = (r) => [1,2,3,4,5].map((n) => `<i class="${r >= n - 0.25 ? "fas" : r >= n - 0.75 ? "fas fa-star-half-alt" : "far"} ${r >= n - 0.75 && r < n - 0.25 ? "" : "fa-star"} text-yellow-400"></i>`).join("");

const bloque = (titulo, ic, bg, color, ico, arr) => `<section class="bg-white rounded-2xl shadow-soft p-6 border-l-4 ${bg}"><h2 class="text-lg font-bold text-gray-900 mb-3"><i class="fas ${ic} ${color} mr-2"></i>${titulo}</h2><ul class="space-y-2">${lista(arr, ico, color)}</ul></section>`;

const id = new URLSearchParams(location.search).get("id");
const m = MEDS[id], app = document.getElementById("app");

if (!m) {
  app.innerHTML = `<div class="bg-white rounded-2xl shadow-soft p-10 text-center max-w-xl mx-auto mt-10"><i class="fas fa-pills text-4xl text-gray-300 mb-4"></i><h1 class="text-xl font-semibold text-gray-900 mb-2">No encontramos este medicamento</h1><p class="text-gray-600 mb-6">El enlace puede estar incompleto o el producto ya no existe.</p><a href="4_medicamentos.html" class="inline-block health-gradient text-white px-6 py-2.5 rounded-xl font-medium hover:opacity-90">Volver al catálogo</a></div>`;
} else {
  document.title = m.nombre + " - ComparaSalud";
  app.innerHTML = `
  <nav class="text-sm text-gray-500 mb-4"><a href="4_medicamentos.html" class="hover:text-blue-600"><i class="fas fa-arrow-left mr-1"></i>Volver a medicamentos</a></nav>

  <div class="bg-white rounded-2xl shadow-soft p-6 mb-6 flex flex-col md:flex-row md:items-center gap-6">
    <div class="w-20 h-20 rounded-2xl health-gradient text-white flex items-center justify-center flex-shrink-0"><i class="fas fa-pills text-3xl"></i></div>
    <div class="flex-1 min-w-0">
      <div class="flex flex-wrap gap-2 mb-2">
        <span class="bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full text-xs font-medium">${esc(m.cat)}</span>
        ${m.rx ? '<span class="bg-red-100 text-red-800 px-2.5 py-1 rounded-full text-xs font-medium"><i class="fas fa-file-prescription mr-1"></i>Con receta</span>' : '<span class="bg-green-100 text-green-800 px-2.5 py-1 rounded-full text-xs font-medium">Venta libre</span>'}
      </div>
      <h1 class="text-2xl md:text-3xl font-bold text-gray-900">${esc(m.nombre)}</h1>
      <p class="text-gray-500">${esc(m.pres)} · Principio activo: ${esc(m.activo)}</p>
      <div class="flex flex-wrap items-center gap-x-2 mt-2">${est(m.rating)}<span class="font-semibold text-gray-900">${m.rating.toFixed(1)}</span><span class="text-gray-500 text-sm">(${m.rev} reseñas)</span></div>
    </div>
    <div class="text-left md:text-right">
      <p class="text-sm text-gray-500">Precio desde</p>
      <p class="text-3xl font-bold text-green-600">S/ ${m.precio.toFixed(2)}</p>
      <p class="text-sm text-gray-500 mt-1"><i class="fas fa-hospital mr-1"></i>${esc(m.sede)}</p>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 space-y-6">
      <section class="bg-white rounded-2xl shadow-soft p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-3"><i class="fas fa-circle-info text-[#2563EB] mr-2"></i>Descripción</h2>
        <p class="text-gray-600 leading-relaxed">${esc(m.desc)}</p>
        <h3 class="font-semibold text-gray-900 mt-5 mb-3">Para qué se usa</h3>
        <div class="flex flex-wrap gap-2">${m.usos.map((u) => `<span class="bg-green-50 text-green-700 px-3 py-1 rounded-full text-sm">${esc(u)}</span>`).join("")}</div>
      </section>
      ${bloque("Advertencias", "fa-triangle-exclamation", "border-amber-400", "text-amber-500", "fa-exclamation-circle", m.adv)}
      ${bloque("Contraindicaciones", "fa-ban", "border-red-400", "text-red-500", "fa-times-circle", m.contra)}
      ${bloque("Recomendaciones de uso", "fa-lightbulb", "border-green-400", "text-green-500", "fa-check-circle", m.rec)}
    </div>
    <aside class="space-y-6">
      <section class="bg-white rounded-2xl shadow-soft p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4">Ficha rápida</h2>
        <dl class="space-y-3 text-sm">
          <div class="flex justify-between"><dt class="text-gray-500">Presentación</dt><dd class="font-medium text-gray-900 text-right">${esc(m.pres)}</dd></div>
          <div class="flex justify-between"><dt class="text-gray-500">Categoría</dt><dd class="font-medium text-gray-900">${esc(m.cat)}</dd></div>
          <div class="flex justify-between"><dt class="text-gray-500">Venta</dt><dd class="font-medium text-gray-900">${m.rx ? "Con receta" : "Libre"}</dd></div>
        </dl>
        <a href="4_comparativa_medicamento.html?med=${encodeURIComponent(m.nombre.toLowerCase())}" class="mt-5 w-full health-gradient text-white py-3 rounded-xl font-semibold hover:opacity-90 flex items-center justify-center"><i class="fas fa-balance-scale mr-2"></i>Comparar precios</a>
      </section>
      <div class="bg-amber-50 border border-amber-200 text-amber-900 rounded-2xl p-5 text-sm"><i class="fas fa-user-doctor mr-2"></i>Esta información es referencial. Consulta siempre a tu médico o farmacéutico antes de usar un medicamento.</div>
    </aside>
  </div>`;

</script>
