.tab-btn.active{border-bottom-color:#2563eb;color:#2563eb}
</style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-100">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center py-4">
    <a href="3_user_dashboard.html" class="flex items-center space-x-3"><img src="../assets/img/logo.png" alt="ComparaSalud" class="w-10 h-10" /><span class="text-xl font-bold text-gray-900">ComparaSalud</span></a>
    <div class="hidden md:flex items-center space-x-8">
      <a href="3_user_dashboard.html" class="text-gray-600 hover:text-blue-600 font-medium">Inicio</a>
      <a href="4_search_results.html" class="text-gray-600 hover:text-blue-600 font-medium">Búsqueda</a>
      <a href="4_medicamentos.html" class="text-blue-600 font-semibold">Medicamentos</a>

  </div>
</nav>

<main id="app" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6"></main>
<footer class="bg-gray-800 text-white pt-12 pb-8" id="footer"></footer>

<script src="../js/components/footer.js"></script>
<script src="../js/services/auth.js"></script>
<script src="../js/services/usuario.js?v=3"></script>
<script>document.addEventListener("DOMContentLoaded", function () { if (window.UsuarioService) UsuarioService.pintarCabecera(); });</script>
<script>
/* Simula GET /api/medicamento?id= (entidad Medicamento: PrincipioActivo, Laboratorio, RegistroSanitario) */
const MEDS = {
  1:{marca:"Panadol 500 mg",pres:"Caja x 20 tabletas",cat:"Analgésicos",precio:12.50,rx:false,desc:"Analgésico y antipirético para dolor leve a moderado y fiebre.",
     PrincipioActivo:"Paracetamol",Concentracion:"500 mg",Forma:"Tableta recubierta",Laboratorio:"GSK Consumer Healthcare Perú S.A.",RegistroSanitario:"EN-04521",Via:"Oral",Conservacion:"Menos de 30 °C, lejos de la humedad",
     servs:[["Consulta Médica General","Clínica San Juan",80],["Consulta Médica General","Clínica Surco Vital",95],["Dr. Luis Paredes (consulta)","Clínica Médica Central",70]]},
  2:{marca:"Brufen 400 mg",pres:"Caja x 10 tabletas",cat:"Antiinflamatorios",precio:15.00,rx:false,desc:"Antiinflamatorio no esteroideo para dolor, inflamación y fiebre.",
     PrincipioActivo:"Ibuprofeno",Concentracion:"400 mg",Forma:"Tableta recubierta",Laboratorio:"Abbott Laboratories Perú S.A.",RegistroSanitario:"EN-07835",Via:"Oral",Conservacion:"Menos de 25 °C",
     servs:[["Consulta Médica General","Clínica San Juan",80],["Dra. Ana López (consulta)","Centro Médico San Isidro",180]]},
  3:{marca:"Cozaar 50 mg",pres:"Caja x 30 tabletas",cat:"Cardiovasculares",precio:28.00,rx:true,desc:"Antihipertensivo de uso diario para controlar la presión arterial.",
     PrincipioActivo:"Losartán potásico",Concentracion:"50 mg",Forma:"Tableta recubierta",Laboratorio:"Organon Peruana S.A.",RegistroSanitario:"EN-11290",Via:"Oral",Conservacion:"Menos de 30 °C, protegido de la luz",
     servs:[["Consulta con Especialista","Centro Cardiológico",120],["Chequeo Cardiovascular","Centro Cardiológico",180]]},
  4:{marca:"Amoxil 500 mg",pres:"Caja x 12 cápsulas",cat:"Antibióticos",precio:21.90,rx:true,desc:"Antibiótico de amplio espectro para infecciones bacterianas.",
     PrincipioActivo:"Amoxicilina",Concentracion:"500 mg",Forma:"Cápsula dura",Laboratorio:"GlaxoSmithKline Perú S.A.",RegistroSanitario:"EN-02318",Via:"Oral",Conservacion:"Menos de 25 °C",
     servs:[["Consulta Médica General","Clínica Médica Central",70],["Consulta Médica General","Clínica Surco Vital",95]]},
  5:{marca:"Losec 20 mg",pres:"Caja x 14 cápsulas",cat:"Gastrointestinales",precio:26.40,rx:false,desc:"Reduce la producción de ácido gástrico; alivia acidez y reflujo.",
     PrincipioActivo:"Omeprazol",Concentracion:"20 mg",Forma:"Cápsula de liberación retardada",Laboratorio:"AstraZeneca Perú S.A.",RegistroSanitario:"EN-09144",Via:"Oral",Conservacion:"Menos de 25 °C, en lugar seco",
     servs:[["Consulta Médica General","Clínica Miraflores Salud",85]]},
  6:{marca:"Claritin 10 mg",pres:"Caja x 10 tabletas",cat:"Antialérgicos",precio:14.80,rx:false,desc:"Antihistamínico que alivia la alergia sin producir somnolencia en la mayoría.",
     PrincipioActivo:"Loratadina",Concentracion:"10 mg",Forma:"Tableta",Laboratorio:"Bayer S.A.",RegistroSanitario:"EN-05672",Via:"Oral",Conservacion:"Entre 15 y 30 °C",
     servs:[["Examen Visual","Clínica San Juan",50],["Consulta Médica General","Policlínico La Molina",65]]},
  7:{marca:"Glucophage 850 mg",pres:"Caja x 30 tabletas",cat:"Endocrinológicos",precio:24.50,rx:true,desc:"Antidiabético oral para el control de la glucosa en diabetes tipo 2.",
     PrincipioActivo:"Metformina clorhidrato",Concentracion:"850 mg",Forma:"Tableta recubierta",Laboratorio:"Merck Peruana S.A.",RegistroSanitario:"EN-03987",Via:"Oral",Conservacion:"Menos de 30 °C",
     servs:[["Dr. Andrés Vega (consulta)","Centro Médico San Isidro",190],["Análisis de Sangre Completo","Laboratorio Médico Central",65]]},
  8:{marca:"Lipitor 20 mg",pres:"Caja x 30 tabletas",cat:"Cardiovasculares",precio:48.00,rx:true,desc:"Estatina que reduce el colesterol LDL y los triglicéridos.",
     PrincipioActivo:"Atorvastatina cálcica",Concentracion:"20 mg",Forma:"Tableta recubierta",Laboratorio:"Pfizer S.A.",RegistroSanitario:"EN-08423",Via:"Oral",Conservacion:"Menos de 30 °C",
     servs:[["Perfil Lipídico","Laboratorio Miraflores Diagnóstica",55],["Chequeo Cardiovascular","Centro Cardiológico",180]]},
  9:{marca:"Ventolin inhalador",pres:"Frasco 200 dosis",cat:"Respiratorios",precio:29.90,rx:false,desc:"Broncodilatador de acción rápida para la falta de aire y la sibilancia.",
     PrincipioActivo:"Salbutamol sulfato",Concentracion:"100 mcg/dosis",Forma:"Suspensión para inhalación",Laboratorio:"GlaxoSmithKline Perú S.A.",RegistroSanitario:"EN-01956",Via:"Inhalatoria",Conservacion:"Menos de 30 °C, lejos del calor",
     servs:[["Consulta Médica General","Clínica San Juan",80],["Dra. María González (consulta)","Clínica San Juan",110]]},
  10:{marca:"Zithromax 500 mg",pres:"Caja x 3 tabletas",cat:"Antibióticos",precio:39.00,rx:true,desc:"Antibiótico macrólido para infecciones respiratorias y de piel.",
     PrincipioActivo:"Azitromicina dihidrato",Concentracion:"500 mg",Forma:"Tableta recubierta",Laboratorio:"Pfizer S.A.",RegistroSanitario:"EN-06310",Via:"Oral",Conservacion:"Menos de 30 °C",
     servs:[["Consulta Médica General","Clínica Angloamericana",120]]}
};
const esc = (s) => { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; };
const app = document.getElementById("app");
const idRaw = new URLSearchParams(location.search).get("id");
const id = /^\d{1,3}$/.test(idRaw || "") ? idRaw : null;
const m = id ? MEDS[id] : null;

function error(titulo, txt) {
  app.innerHTML = `<div class="bg-white rounded-2xl shadow-soft p-10 text-center max-w-xl mx-auto mt-10"><i class="fas fa-pills text-4xl text-gray-300 mb-4"></i><h1 class="text-xl font-semibold text-gray-900 mb-2">${titulo}</h1><p class="text-gray-600 mb-6">${txt}</p><a href="4_medicamento_busqueda.html" class="inline-block health-gradient text-white px-6 py-2.5 rounded-xl font-medium hover:opacity-90">Buscar por nombre comercial</a></div>`;
}

if (!idRaw) error("Falta seleccionar un medicamento", "Entra desde la búsqueda y elige el medicamento que quieres revisar.");
else if (!id) error("Identificador no válido", "El enlace está dañado: el identificador del medicamento debe ser un número.");
else if (!m) error("No encontramos este medicamento", "El enlace puede estar incompleto o el producto ya no existe.");
else {
  document.title = m.marca + " - ComparaSalud";
  const fila = (ic, k, v) => `<div class="flex items-start gap-4 p-4 bg-gray-50 rounded-xl"><div class="w-10 h-10 rounded-lg health-gradient text-white flex items-center justify-center flex-shrink-0"><i class="fas ${ic}"></i></div><div class="min-w-0"><dt class="text-xs text-gray-500 uppercase font-semibold">${k}</dt><dd class="font-semibold text-gray-900">${esc(v)}</dd></div></div>`;
  app.innerHTML = `
  <nav class="text-sm text-gray-500 mb-4"><a href="4_medicamento_busqueda.html" class="hover:text-blue-600"><i class="fas fa-arrow-left mr-1"></i>Volver a la búsqueda</a></nav>

  <div class="bg-white rounded-2xl shadow-soft p-6 mb-6 flex flex-col md:flex-row md:items-center gap-6">
    <div class="w-20 h-20 rounded-2xl health-gradient text-white flex items-center justify-center flex-shrink-0"><i class="fas fa-pills text-3xl"></i></div>
    <div class="flex-1 min-w-0">
      <div class="flex flex-wrap gap-2 mb-2">
        <span class="bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full text-xs font-medium">${esc(m.cat)}</span>
        <span class="bg-purple-100 text-purple-800 px-2.5 py-1 rounded-full text-xs font-medium"><i class="fas fa-tag mr-1"></i>Comercial</span>
        ${m.rx ? '<span class="bg-red-100 text-red-800 px-2.5 py-1 rounded-full text-xs font-medium"><i class="fas fa-file-prescription mr-1"></i>Con receta</span>' : '<span class="bg-green-100 text-green-800 px-2.5 py-1 rounded-full text-xs font-medium">Venta libre</span>'}
      </div>
      <h1 class="text-2xl md:text-3xl font-bold text-gray-900">${esc(m.marca)}</h1>
      <p class="text-gray-500">${esc(m.pres)}</p>
    </div>
    <div class="text-left md:text-right"><p class="text-sm text-gray-500">Precio desde</p><p class="text-3xl font-bold text-green-600">S/ ${m.precio.toFixed(2)}</p></div>
  </div>

  <div class="bg-white rounded-lg shadow-sm mb-6">
    <div class="flex border-b overflow-x-auto" role="tablist" aria-label="Secciones del medicamento">
      <button type="button" role="tab" data-tab="info" class="tab-btn active px-6 py-4 font-medium whitespace-nowrap"><i class="fas fa-circle-info mr-2"></i>Descripción</button>
      <button type="button" role="tab" data-tab="ficha" class="tab-btn px-6 py-4 font-medium whitespace-nowrap"><i class="fas fa-file-medical mr-2"></i>Ficha Técnica</button>
      <button type="button" role="tab" data-tab="servs" class="tab-btn px-6 py-4 font-medium whitespace-nowrap"><i class="fas fa-stethoscope mr-2"></i>Dónde se incluye <span class="ml-1 text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">${m.servs.length}</span></button>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2">
      <section id="p-info" class="tab-panel bg-white rounded-2xl shadow-soft p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-3">Descripción</h2>
        <p class="text-gray-600 leading-relaxed">${esc(m.desc)}</p>
        <div class="mt-5 flex flex-wrap gap-3"><button type="button" data-go="ficha" class="border border-[#2563EB] text-[#2563EB] px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-50"><i class="fas fa-file-medical mr-2"></i>Ver ficha técnica</button><a href="4_medicamento_detalle.html?id=${id}" class="border border-amber-500 text-amber-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-amber-50"><i class="fas fa-triangle-exclamation mr-2"></i>Advertencias y recomendaciones</a></div>
      </section>

      <!-- HU28: pestaña "Ficha Técnica" => GET /api/medicamento?id= -->
      <section id="p-ficha" class="tab-panel hidden bg-white rounded-2xl shadow-soft p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-1">Ficha técnica</h2>
        <p class="text-gray-500 text-sm mb-5">Datos oficiales del producto registrados en la entidad Medicamento.</p>
        <div id="fichaLoad" class="hidden text-center text-gray-600 py-8"><i class="fas fa-spinner fa-spin text-2xl text-[#2563EB] mb-3"></i><p>Consultando ficha técnica...</p></div>
        <div id="fichaErr" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm flex items-center justify-between gap-4 flex-wrap" role="alert"><span><i class="fas fa-exclamation-circle mr-2"></i>No pudimos cargar la ficha técnica (GET /api/medicamento).</span><button id="fichaRetry" type="button" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-700"><i class="fas fa-redo mr-2"></i>Reintentar</button></div>
        <dl id="fichaBody" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-4">
          ${fila("fa-flask","Principio activo",m.PrincipioActivo)}
          ${fila("fa-industry","Laboratorio fabricante",m.Laboratorio)}
          ${fila("fa-certificate","Registro sanitario",m.RegistroSanitario)}
          ${fila("fa-weight-hanging","Concentración",m.Concentracion)}
          ${fila("fa-capsules","Forma farmacéutica",m.Forma)}
          ${fila("fa-route","Vía de administración",m.Via)}
          <div class="sm:col-span-2 flex items-start gap-4 p-4 bg-gray-50 rounded-xl"><div class="w-10 h-10 rounded-lg health-gradient text-white flex items-center justify-center flex-shrink-0"><i class="fas fa-temperature-low"></i></div><div><dt class="text-xs text-gray-500 uppercase font-semibold">Conservación</dt><dd class="font-semibold text-gray-900">${esc(m.Conservacion)}</dd></div></div>
        </dl>
        <p class="text-xs text-gray-400 mt-4">El registro sanitario es referencial. Verifica siempre en DIGEMID.</p>
      </section>

      <section id="p-servs" class="tab-panel hidden bg-white rounded-2xl shadow-soft p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4">Atenciones que incluyen este medicamento</h2>
        <ul class="divide-y divide-gray-100 text-sm border border-gray-100 rounded-xl">
          ${m.servs.map(([s,sede,p]) => `<li class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 px-4 py-3"><div class="min-w-0"><p class="font-medium text-gray-800">${esc(s)}</p><p class="text-gray-500 text-xs"><i class="fas fa-hospital mr-1"></i>${esc(sede)}</p></div><span class="font-semibold text-gray-900 whitespace-nowrap">S/ ${p.toFixed(2)}</span></li>`).join("")}
        </ul>
      </section>
    </div>

    <aside class="space-y-6">
      <section class="bg-white rounded-2xl shadow-soft p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4">Ficha rápida</h2>
        <dl class="space-y-3 text-sm">
          <div class="flex justify-between"><dt class="text-gray-500">Presentación</dt><dd class="font-medium text-gray-900 text-right">${esc(m.pres)}</dd></div>
          <div class="flex justify-between"><dt class="text-gray-500">Categoría</dt><dd class="font-medium text-gray-900">${esc(m.cat)}</dd></div>
          <div class="flex justify-between"><dt class="text-gray-500">Venta</dt><dd class="font-medium text-gray-900">${m.rx ? "Con receta" : "Libre"}</dd></div>
        </dl>
        <a href="4_comparativa_medicamento.html?med=${encodeURIComponent(m.PrincipioActivo.split(" ")[0].toLowerCase())}" class="mt-5 w-full health-gradient text-white py-3 rounded-xl font-semibold hover:opacity-90 flex items-center justify-center"><i class="fas fa-balance-scale mr-2"></i>Comparar precios</a>
      </section>
      <div class="bg-amber-50 border border-amber-200 text-amber-900 rounded-2xl p-5 text-sm"><i class="fas fa-user-doctor mr-2"></i>Información referencial. Consulta a tu médico o farmacéutico antes de usar un medicamento.</div>
    </aside>
  </div>`;

  let timer = null;
  function cargarFicha() {
    clearTimeout(timer);
    ["fichaBody","fichaErr"].forEach((i) => document.getElementById(i).classList.add("hidden"));
    document.getElementById("fichaLoad").classList.remove("hidden");
    timer = setTimeout(() => { document.getElementById("fichaLoad").classList.add("hidden"); document.getElementById("fichaBody").classList.remove("hidden"); }, 450);
  }
  function abrir(t) {
    document.querySelectorAll(".tab-btn").forEach((b) => { const on = b.dataset.tab === t; b.classList.toggle("active", on); b.setAttribute("aria-selected", on); });
    document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("hidden", p.id !== "p-" + t));
    if (t === "ficha") cargarFicha();
  }
  document.querySelectorAll(".tab-btn").forEach((b) => b.addEventListener("click", () => abrir(b.dataset.tab)));
  document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => abrir(b.dataset.go)));
  document.getElementById("fichaRetry").addEventListener("click", cargarFicha);
  const h = location.hash.replace("#", "");
  abrir(["info","ficha","servs"].includes(h) ? h : "info");
}
</script>
</body>
</html>
