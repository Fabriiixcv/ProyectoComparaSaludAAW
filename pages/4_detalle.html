<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="shortcut icon" href="../assets/logo.ico" type="image/x-icon" />
<title>Información - ComparaSalud</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  body{font-family:"Inter",sans-serif}
  .health-gradient{background:linear-gradient(135deg,#2563eb 0%,#10b981 100%)}
  .shadow-soft{box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06)}
  .rel-card{transition:transform .2s,box-shadow .2s}
  .rel-card:hover{transform:translateY(-3px);box-shadow:0 10px 25px -3px rgba(0,0,0,.1)}
  @media(prefers-reduced-motion:reduce){.rel-card{transition:none}.rel-card:hover{transform:none}}
</style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="toast" class="hidden fixed top-20 right-4 z-[60] max-w-sm bg-green-50 border border-green-200 text-green-800 rounded-xl shadow-lg px-4 py-3" role="status"><i class="fas fa-check-circle text-green-600 mr-2"></i><span id="toastText" class="text-sm font-medium"></span></div>

<nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-100">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center py-4">
    <a href="3_user_dashboard.html" class="flex items-center space-x-3">
      <img src="../assets/img/logo.png" alt="ComparaSalud" class="w-10 h-10" />
      <span class="text-xl font-bold text-gray-900">ComparaSalud</span>
    </a>
    <div class="hidden md:flex items-center space-x-8">
      <a href="3_user_dashboard.html" class="text-gray-600 hover:text-blue-600 font-medium">Inicio</a>
      <a href="4_search_results.html" class="text-gray-600 hover:text-blue-600 font-medium">Búsqueda</a>
      <a href="6_favorites.html" class="text-gray-600 hover:text-blue-600 font-medium">Favoritos</a>
      <a href="8_help_center.html" class="text-gray-600 hover:text-blue-600 font-medium">Ayuda</a>
    </div>
    <a href="6_user_profile.html" class="w-8 h-8 health-gradient rounded-full flex items-center justify-center text-white font-semibold" aria-label="Mi perfil">U</a>
  </div>
</nav>

<main id="app" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6"></main>
<footer class="bg-gray-800 text-white pt-12 pb-8" id="footer"></footer>

<script src="../js/components/footer.js"></script>
<script src="../js/services/auth.js"></script>
<script src="../js/services/usuario.js?v=3"></script>
<script>document.addEventListener("DOMContentLoaded",function(){UsuarioService.pintarCabecera();});</script>
<script>
(function(){
const TIPOS={servicios:{singular:"Servicio",plural:"Servicios"},medicos:{singular:"Médico",plural:"Médicos"},clinicas:{singular:"Clínica",plural:"Clínicas"}};
// Información que dejó la página de búsqueda al pulsar "Ver más información"
let P=null;
try{P=JSON.parse(localStorage.getItem("cs_detalle"))}catch(e){}
const params=new URLSearchParams(location.search);
if(P&&(P.tipo!==params.get("tipo")||String(P.item.id)!==params.get("id")))P=null;
const tipo=P?P.tipo:(TIPOS[params.get("tipo")]?params.get("tipo"):"servicios");
const x=P?P.item:null;
const app=document.getElementById("app");
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML};
function toast(m){document.getElementById("toastText").textContent=m;const t=document.getElementById("toast");t.classList.remove("hidden");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add("hidden"),2500)}

const HORARIOS={
  servicios:[["Lunes - Viernes","8:00 AM - 7:00 PM"],["Sábados","8:00 AM - 1:00 PM"],["Domingos","Cerrado"]],
  medicos:[["Lunes - Viernes","9:00 AM - 6:00 PM"],["Sábados","9:00 AM - 1:00 PM"],["Domingos","Cerrado"]],
  clinicas:[["Lunes - Viernes","7:00 AM - 10:00 PM"],["Sábados","8:00 AM - 6:00 PM"],["Domingos","9:00 AM - 1:00 PM"]]
};
const PREP={
  Consultas:"Lleva tu DNI y, si los tienes, tus exámenes anteriores.",
  Chequeos:"Lleva tu DNI y tu historial médico, y confirma si necesitas ayuno.",
  Laboratorio:"Confirma si necesitas ayuno antes de la toma de muestra y lleva tu DNI.",
  "Imágenes":"Lleva tu orden médica y los estudios previos para compararlos.",
  "Odontología":"Cepíllate antes de la cita y avisa si tomas algún medicamento.",
  "Oftalmología":"Si usas lentes o lentes de contacto, llévalos contigo."
};
const PREP_TIPO={
  medicos:"Lleva tu DNI, tus exámenes recientes y la lista de medicamentos que tomas.",
  clinicas:"Lleva tu DNI y tu seguro si tienes uno, y confirma el horario por teléfono."
};
const RESENAS={
  servicios:["El servicio fue rápido y bien explicado. El precio coincidió con lo publicado.","Muy buena experiencia, entregaron todo a tiempo y con indicaciones claras.","Buen servicio y trato amable. Lo volvería a contratar."],
  medicos:["Muy atento y claro al explicar el diagnóstico. Me sentí en confianza.","Puntual y profesional. El tratamiento funcionó bien.","Resolvió todas mis dudas y me dio seguimiento por mensaje."],
  clinicas:["Instalaciones limpias y personal amable. Sin sorpresas en el cobro.","Buena atención, aunque hubo algo de espera. Los precios coinciden con lo publicado.","Fácil de ubicar y con buen servicio. La recomiendo para consultas de rutina."]
};
const AUTORES=["María Rodríguez","Carlos Pérez","Ana García"], FECHAS=["Hace 2 semanas","Hace 1 mes","Hace 2 meses"];
const estrellas=(n,cls="text-yellow-400")=>[1,2,3,4,5].map(i=>`<i class="${i<=Math.round(n)?"fas":"far"} fa-star ${cls}"></i>`).join("");

function mini(t,it){
  const av=it.img?`<img src="../assets/img/doctores/${it.img}" alt="" class="w-14 h-14 rounded-full object-cover flex-shrink-0" />`:`<div class="w-14 h-14 rounded-xl health-gradient text-white flex items-center justify-center flex-shrink-0"><i class="fas ${it.icon}"></i></div>`;
  return `<div class="bg-white rounded-2xl shadow-soft p-4 flex items-center gap-4">${av}
  <div class="min-w-0 flex-1"><p class="font-semibold text-gray-900 truncate">${esc(it.nombre)}</p><p class="text-gray-500 text-sm truncate">${t==="clinicas"?esc(it.distrito):esc(it.cat)}</p></div>
  <span class="font-bold text-green-600 whitespace-nowrap">S/ ${it.precio}</span></div>`;
}
function grupo(titulo,t,items){
  if(!items.length)return"";
  return `<section class="mt-8"><h2 class="text-xl font-bold text-gray-900 mb-4">${esc(titulo)}</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-4">${items.map(i=>mini(t,i)).join("")}</div></section>`;
}
function relacionados(c){
  let h="";
  if(tipo!=="clinicas")h+=`<section class="mt-8"><h2 class="text-xl font-bold text-gray-900 mb-4">${tipo==="servicios"?"Dónde se ofrece":"Dónde atiende"}</h2><div class="bg-white rounded-2xl shadow-soft p-4 flex items-center gap-4"><div class="w-14 h-14 rounded-xl health-gradient text-white flex items-center justify-center flex-shrink-0"><i class="fas fa-hospital"></i></div><div class="min-w-0"><p class="font-semibold text-gray-900">${esc(c.nombre)}</p><p class="text-gray-500 text-sm">${esc(c.dir)}</p></div></div></section>`;
  if(tipo==="clinicas")h+=grupo("Servicios que ofrece","servicios",P.servicios)+grupo("Médicos que atienden aquí","medicos",P.medicos);
  else if(tipo==="servicios")h+=grupo("Otros servicios de esta clínica","servicios",P.servicios);
  else h+=grupo("Otros médicos de esta clínica","medicos",P.medicos);
  return h;
}

function render(){
  document.title=x.nombre+" - ComparaSalud";
  const T=TIPOS[tipo],c=P.clinica,dir=c.dir,tel=c.tel;
  const horas=x.tags.some(t=>t.includes("24 horas"))?[["Todos los días","24 horas"]]:HORARIOS[tipo];
  const logo=x.img?`<img src="../assets/img/doctores/${x.img}" alt="${esc(x.nombre)}" class="w-full h-full object-cover rounded-xl" />`:`<div class="w-full h-full health-gradient rounded-xl flex items-center justify-center"><i class="fas ${x.icon} text-white text-4xl"></i></div>`;
  const tit={servicios:"Qué incluye",medicos:"Áreas de atención",clinicas:"Especialidades y servicios"}[tipo];
  const lblPrecio={servicios:"Precio del servicio",medicos:"Precio de la consulta",clinicas:"Consulta desde"}[tipo];
  const prep=PREP[x.cat]&&tipo==="servicios"?PREP[x.cat]:PREP_TIPO[tipo]||"Lleva tu DNI y confirma el horario antes de ir.";
  const rev=RESENAS[tipo].map((t,i)=>`<div class="${i?"border-t border-gray-100 pt-4":""}">
    <div class="flex items-center justify-between mb-1"><div class="flex items-center space-x-3"><div class="w-9 h-9 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-semibold text-sm">${AUTORES[i].split(" ").map(p=>p[0]).join("")}</div><div><p class="font-medium text-gray-900 text-sm">${AUTORES[i]}</p><p class="text-gray-500 text-xs">${FECHAS[i]}</p></div></div><div class="text-sm">${estrellas(i===2?Math.max(4,x.rating-1):x.rating)}</div></div>
    <p class="text-gray-600 text-sm">${esc(t)}</p></div>`).join("");

  app.innerHTML=`
  <nav class="text-sm text-gray-500 mb-4"><a href="4_search_results.html?tipo=${tipo}" class="hover:text-blue-600"><i class="fas fa-arrow-left mr-1"></i>Volver a ${T.plural.toLowerCase()}</a></nav>

  <div class="bg-white rounded-2xl shadow-soft overflow-hidden mb-6">
    <div class="h-36 md:h-48 bg-gradient-to-r from-blue-500 to-green-400"></div>
    <div class="px-6 pb-6"><div class="flex flex-col md:flex-row md:items-end -mt-14 md:-mt-16">
      <div class="w-28 h-28 md:w-36 md:h-36 bg-white rounded-2xl shadow-lg p-2 flex-shrink-0">${logo}</div>
      <div class="flex-1 md:ml-6 mt-4 md:mt-0 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="min-w-0">
          <span class="inline-block bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-xs font-medium mb-2">${T.singular} • ${esc(x.cat)}</span>
          <h1 class="text-2xl md:text-3xl font-bold text-gray-900">${esc(x.nombre)}</h1>
          <p class="text-blue-600 font-medium">${esc(x.sub)}</p>
          <div class="flex flex-wrap items-center mt-2 gap-x-3 text-gray-600"><span>${estrellas(x.rating)}</span><span class="font-medium">${x.rating.toFixed(1)}</span><span class="text-gray-500">(${x.rev} reseñas)</span></div>
          <p class="text-gray-600 mt-1"><i class="fas fa-map-marker-alt text-gray-400 mr-1"></i>${esc(dir)}</p>
        </div>
        <button id="shareBtn" type="button" class="flex items-center justify-center w-12 h-12 bg-blue-50 text-blue-500 rounded-xl hover:bg-blue-100" aria-label="Copiar enlace"><i class="far fa-share-square text-xl"></i></button>
      </div>
    </div></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 space-y-6">
      <section class="bg-white rounded-2xl shadow-soft p-6">
        <h2 class="text-xl font-bold text-gray-900 mb-3">Información general</h2>
        <p class="text-gray-600 leading-relaxed">${esc(x.desc)}</p>
        <h3 class="font-semibold text-gray-900 mt-5 mb-3">${tit}</h3>
        <div class="flex flex-wrap gap-2">${x.tags.map(t=>`<span class="bg-green-50 text-green-700 px-3 py-1 rounded-full text-sm">${esc(t)}</span>`).join("")}</div>
        <div class="mt-5 p-4 bg-blue-50 rounded-xl border border-blue-200 flex items-center justify-between gap-4">
          <div><p class="text-blue-900 font-semibold">${lblPrecio}</p><p class="text-blue-700 text-sm">Precio transparente, sin cargos ocultos.</p></div>
          <p class="text-3xl font-bold text-green-600 whitespace-nowrap">S/ ${x.precio}</p>
        </div>
        <div class="mt-4 p-4 bg-amber-50 rounded-xl border border-amber-200 text-amber-900 text-sm"><i class="fas fa-lightbulb mr-2"></i><strong>Antes de ir:</strong> ${esc(prep)}</div>
      </section>
      <section id="resenas" class="bg-white rounded-2xl shadow-soft p-6"><div class="flex items-center justify-between gap-3 flex-wrap mb-4"><h2 class="text-xl font-bold text-gray-900">Reseñas de pacientes</h2>${tipo==="servicios"?`<a href="4_servicio_resenas.html?id=${esc(x.id)}" class="health-gradient text-white px-4 py-2 rounded-xl font-medium hover:opacity-90 inline-flex items-center"><i class="fas fa-pen-to-square mr-2"></i>Agregar reseña</a>`:""}</div><div class="space-y-4">${rev}</div></section>
    </div>
    <aside class="space-y-6">
      <section class="bg-white rounded-2xl shadow-soft p-6">
        <h2 class="text-xl font-bold text-gray-900 mb-4">Ubicación y contacto</h2>
        <div class="space-y-4">
          <div class="flex items-start"><i class="fas fa-map-marker-alt text-gray-400 mt-1 mr-3"></i><div><p class="font-medium text-gray-900">${esc(dir)}</p><p class="text-gray-600 text-sm">${esc(x.distrito)} • ${x.dist.toFixed(1)} km de ti</p></div></div>
          <div class="flex items-start"><i class="fas fa-phone-alt text-gray-400 mt-1 mr-3"></i><div><p class="font-medium text-gray-900">${esc(tel)}</p><p class="text-gray-600 text-sm">Línea de atención</p></div></div>
          <div class="pt-4 border-t border-gray-200"><h3 class="font-semibold text-gray-900 mb-3">Horarios de atención</h3>
            <div class="space-y-2 text-sm">${horas.map(([d,h])=>`<div class="flex justify-between"><span class="text-gray-600">${d}</span><span class="font-medium text-gray-900">${h}</span></div>`).join("")}</div></div>
          <div class="pt-4 border-t border-gray-200">${x.disp?'<span class="text-green-600 text-sm font-medium"><i class="fas fa-circle text-[8px] mr-2"></i>Disponible esta semana</span>':'<span class="text-yellow-600 text-sm font-medium"><i class="fas fa-circle text-[8px] mr-2"></i>Disponibilidad limitada</span>'}</div>
          <div class="space-y-3 pt-2">
            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir+", Lima, Perú")}" target="_blank" rel="noopener" class="w-full health-gradient text-white py-3 rounded-xl font-semibold shadow hover:shadow-lg flex items-center justify-center"><i class="fas fa-directions mr-2"></i>Cómo llegar</a>
            <button id="copyBtn" type="button" class="w-full border border-gray-300 text-gray-700 py-3 rounded-xl font-semibold hover:bg-gray-50 flex items-center justify-center"><i class="far fa-copy mr-2"></i>Copiar dirección</button>
          </div>
        </div>
      </section>
      <a href="tel:${esc(tel.replace(/[^\d+]/g,""))}" class="block bg-gradient-to-br from-blue-500 to-green-400 rounded-2xl p-6 text-white text-center font-bold shadow-soft hover:opacity-95"><i class="fas fa-phone-alt mr-2"></i>Llamar ahora</a>
    </aside>
  </div>
  ${relacionados(c)}`;

  const copiar=(t,m)=>{const f=()=>toast(m);navigator.clipboard?navigator.clipboard.writeText(t).then(f,f):f()};
  document.getElementById("shareBtn").onclick=()=>copiar(location.href,"Enlace copiado");
  document.getElementById("copyBtn").onclick=()=>copiar(dir,"Dirección copiada");
}

if(!x){
  app.innerHTML=`<div class="bg-white rounded-2xl shadow-soft p-10 text-center max-w-xl mx-auto mt-10"><i class="fas fa-search text-4xl text-gray-300 mb-4"></i><h1 class="text-xl font-semibold text-gray-900 mb-2">No hay información para mostrar</h1><p class="text-gray-600 mb-6">Entra desde la búsqueda y pulsa "Ver más información" en la tarjeta que quieras revisar.</p><a href="4_search_results.html" class="inline-block health-gradient text-white px-6 py-2.5 rounded-xl font-medium hover:opacity-90">Volver a la búsqueda</a></div>`;
}else render();
})();
</script>
</body>
</html>
